experiment:
  name: AE_KL_552_16_evit_smoke

model:
  model_version: "552_16"
  sample_posterior: false
  patch_embed_type: efficientvit

# tiny smoke range for launch/path validation
dataset:
  train:
    data_dir: huawei_100p:s3://ai4earth/era5_np128x256
    file_stride: 1
    train_stride: 1
    years:
      train: ["2015-01-01 00:00:00", "2015-01-01 12:00:00"]
  valid:
    data_dir: huawei_100p:s3://ai4earth/era5_np128x256
    file_stride: 1
    train_stride: 1
    years:
      valid: ["2018-01-01 00:00:00", "2018-01-01 12:00:00"]

optimizer:
  lr: 1.0e-4
  weight_decay: 1.0e-2

scheduler:
  warmup_ratio: 0.05
  num_cycles: 0.5

loss:
  kl_weight: 2.0e-5
  enable_kl: true

trainer:
  epochs: 1
  batch_size: 1
  valid_batch_size: 1
  log_interval: 1
  grad_clip: 1.0
  refresh_dataloader_each_epoch: false
  valid_num_workers: 1
  save_optimizer_in_snapshot: false
  save_best_checkpoint: false
